# Kubernetes PodSecurityPolicy API version v1.26
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: restricted-psp
  annotations:
    # Seccomp profile configurations
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: 'runtime/default'
    seccomp.security.alpha.kubernetes.io/defaultProfileName: 'runtime/default'
    # AppArmor profile configurations  
    apparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default'
    apparmor.security.beta.kubernetes.io/defaultProfileName: 'runtime/default'
    # Additional metadata
    kubernetes.io/description: 'Restricted policy enforcing strict security controls'
    policies.kubernetes.io/last-updated: '2023-01-01'
    policies.kubernetes.io/maintainer: 'security-team'

spec:
  # Prevent privileged container execution
  privileged: false
  
  # Prevent privilege escalation
  allowPrivilegeEscalation: false
  
  # Drop all Linux capabilities
  requiredDropCapabilities:
    - ALL
    
  # Allowed volume types
  volumes:
    - configMap
    - emptyDir
    - projected
    - secret
    - downwardAPI
    - persistentVolumeClaim
    
  # Prevent host namespace access
  hostNetwork: false
  hostIPC: false
  hostPID: false
  
  # User execution controls
  runAsUser:
    rule: MustRunAsNonRoot
    
  # SELinux context controls
  seLinux:
    rule: RunAsAny
    
  # Supplemental groups configuration
  supplementalGroups:
    rule: MustRunAs
    ranges:
      - min: 1
        max: 65535
        
  # Filesystem group configuration
  fsGroup:
    rule: MustRunAs
    ranges:
      - min: 1
        max: 65535
        
  # Enforce read-only root filesystem
  readOnlyRootFilesystem: true