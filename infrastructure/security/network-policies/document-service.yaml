# NetworkPolicy API version v1.26
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

# Metadata for the NetworkPolicy resource
metadata:
  name: document-service-network-policy
  namespace: pcs
  labels:
    app: pcs
    component: document-service
    tier: backend

# NetworkPolicy specification
spec:
  # Target pods with document-service labels
  podSelector:
    matchLabels:
      app: pcs
      component: document-service

  # Enable both ingress and egress policies
  policyTypes:
    - Ingress
    - Egress

  # Ingress rules
  ingress:
    # Allow traffic from API Gateway pods
    - from:
        - podSelector:
            matchLabels:
              app: pcs
              component: api-gateway
          namespaceSelector:
            matchLabels:
              name: pcs
      ports:
        - protocol: TCP
          port: 8000

    # Allow Prometheus metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090

  # Egress rules
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

    # Allow MongoDB access
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
          namespaceSelector:
            matchLabels:
              name: pcs
      ports:
        - protocol: TCP
          port: 27017