# Service Accounts for Port Community System (PCS)
# Version: v1
# Purpose: Defines Kubernetes ServiceAccounts with enhanced security features and ISO 27001 compliance

apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: pcs
  labels:
    app: pcs
    component: api-gateway
    security-tier: frontend
    iso27001-compliant: "true"
    audit-enabled: "true"
  annotations:
    kubernetes.io/service-account.name: api-gateway-sa
    kubernetes.io/service-account.namespace: pcs
    security.pcs.io/token-rotation: "enabled"
    security.pcs.io/audit-level: "full"
    security.pcs.io/requires-mfa: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-service-sa
  namespace: pcs
  labels:
    app: pcs
    component: core-service
    security-tier: backend
    iso27001-compliant: "true"
    audit-enabled: "true"
  annotations:
    kubernetes.io/service-account.name: core-service-sa
    kubernetes.io/service-account.namespace: pcs
    security.pcs.io/token-rotation: "enabled"
    security.pcs.io/audit-level: "full"
    security.pcs.io/data-encryption: "required"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-service-sa
  namespace: pcs
  labels:
    app: pcs
    component: document-service
    security-tier: backend
    iso27001-compliant: "true"
    audit-enabled: "true"
  annotations:
    kubernetes.io/service-account.name: document-service-sa
    kubernetes.io/service-account.namespace: pcs
    security.pcs.io/token-rotation: "enabled"
    security.pcs.io/audit-level: "full"
    security.pcs.io/document-encryption: "required"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service-sa
  namespace: pcs
  labels:
    app: pcs
    component: notification-service
    security-tier: backend
    iso27001-compliant: "true"
    audit-enabled: "true"
  annotations:
    kubernetes.io/service-account.name: notification-service-sa
    kubernetes.io/service-account.namespace: pcs
    security.pcs.io/token-rotation: "enabled"
    security.pcs.io/audit-level: "full"
    security.pcs.io/message-encryption: "required"