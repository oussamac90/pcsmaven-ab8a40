# Port Community System RBAC Role Bindings
# Version: v1
# Purpose: Defines secure role bindings with enhanced security controls and ISO 27001 compliance

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: port-authority-binding
  labels:
    app.kubernetes.io/part-of: pcs
    app.kubernetes.io/component: rbac
    security-tier: critical
    access-type: administrative
    rotation-schedule: quarterly
    iso27001-compliant: "true"
  annotations:
    rbac.pcs.io/last-modified: "2024-01-01T00:00:00Z"
    rbac.pcs.io/audit-trail: "enabled"
    rbac.pcs.io/valid-until: "2024-12-31T23:59:59Z"
    rbac.pcs.io/access-review: "quarterly"
    rbac.pcs.io/compliance: "iso27001"
subjects:
- kind: Group
  name: port-authority
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: port-authority-role
  apiGroup: rbac.authorization.k8s.io
---
