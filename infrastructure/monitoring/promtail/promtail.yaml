apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: pcs-monitoring
    security.pcs.io/component: log-collector
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      http_listen_address: 0.0.0.0
      log_level: info
      max_concurrent_streams: 1000
      read_timeout: 5s
      write_timeout: 10s
      idle_timeout: 120s

    positions:
      filename: /run/promtail/positions.yaml
      sync_period: 10s
      ignore_invalid_yaml: false

    clients:
      - url: http://loki.monitoring.svc:3100/loki/api/v1/push
        tenant_id: pcs-production
        external_labels:
          cluster: pcs-production
          environment: production
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10
        rate_limit_config:
          limit: 25MB
          burst_size: 50MB
        tls_config:
          ca_file: /run/secrets/kubernetes.io/serviceaccount/ca.crt
          cert_file: /etc/promtail/certs/tls.crt
          key_file: /etc/promtail/certs/tls.key
          min_version: TLS1.3
          cipher_suites:
            - TLS_AES_128_GCM_SHA256
            - TLS_AES_256_GCM_SHA384
            - TLS_CHACHA20_POLY1305_SHA256

    scrape_configs:
      # System and Security Logs
      - job_name: kubernetes-system-logs
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system, monitoring, security]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_promtail_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
        pipeline_stages:
          - json:
              expressions:
                level: level
                msg: msg
                timestamp: timestamp
          - labels:
              level:
          - timestamp:
              source: timestamp
              format: RFC3339
          - metrics:
              error_total:
                type: Counter
                description: "Total number of error messages"
                source: level
                config:
                  value: error
                  action: inc

      # Application Logs with Security Focus
      - job_name: kubernetes-app-logs
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [default, app]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_promtail_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_label_security_audit]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        pipeline_stages:
          - json:
              expressions:
                level: level
                message: message
                timestamp: timestamp
                user: user
                action: action
                resource: resource
          - labels:
              level:
              user:
              action:
              resource:
          - timestamp:
              source: timestamp
              format: RFC3339
          - match:
              selector: '{action=~"login|logout|access|modify|delete"}'
              stages:
                - metrics:
                    security_events_total:
                      type: Counter
                      description: "Total number of security events"
                      config:
                        action: inc

      # Audit Logs
      - job_name: kubernetes-audit-logs
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [audit]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_promtail_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_label_audit]
            action: keep
            regex: true
        pipeline_stages:
          - json:
              expressions:
                level: level
                event: event
                user: user
                resource: resource
                timestamp: timestamp
          - labels:
              level:
              event:
              user:
              resource:
          - timestamp:
              source: timestamp
              format: RFC3339
          - metrics:
              audit_events_total:
                type: Counter
                description: "Total number of audit events"
                config:
                  action: inc

    limits:
      rate_limit: 25MB
      burst_size: 50MB
      ingestion_rate_mb: 20
      ingestion_burst_size_mb: 30
      max_streams_per_user: 10000

    target_config:
      sync_period: 10s