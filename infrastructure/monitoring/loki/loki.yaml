# Loki Configuration v2.8.0
# Production configuration for Port Community System log aggregation

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_recv_msg_size: 67108864  # 64MB
  grpc_server_max_send_msg_size: 67108864  # 64MB

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  # Optimized chunk management for production
  chunk_idle_period: 1h
  chunk_retain_period: 30s
  max_chunk_age: 2h

# Schema configuration with S3 storage backend
schema_config:
  configs:
    - from: "2023-01-01"
      store: boltdb-shipper
      object_store: s3
      schema: v11
      index:
        prefix: index_
        period: 24h

# Storage configuration with S3 backend
storage_config:
  boltdb_shipper:
    active_index_directory: /data/loki/index
    cache_location: /data/loki/index_cache
    shared_store: s3
  aws:
    s3: s3://pcs-logs-bucket
    region: us-west-2

# Query and ingestion limits configuration
limits_config:
  enforce_metric_name: false
  # Security monitoring - 7 day retention
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Query performance optimization
  max_entries_limit_per_query: 5000

# Chunk store configuration
chunk_store_config:
  max_look_back_period: 168h  # 7 days retention

# Table manager for retention
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h  # 7 days retention

# Compaction configuration
compactor:
  working_directory: /data/loki/compactor
  shared_store: s3