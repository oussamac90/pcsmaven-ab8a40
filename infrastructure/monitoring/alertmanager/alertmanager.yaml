# AlertManager Configuration v0.25.0
# Implements comprehensive alert handling, security monitoring and automated incident response

global:
  # Global timeout for resolved alerts
  resolve_timeout: 5m
  
  # SMTP Configuration
  smtp_from: alertmanager@pcs.com
  smtp_smarthost: smtp.pcs.com:587
  smtp_auth_username: alertmanager
  smtp_auth_identity: alertmanager
  smtp_auth_password: ${SMTP_PASSWORD}
  smtp_require_tls: true

# Custom notification templates
templates:
  - templates/email.tmpl
  - templates/slack.tmpl

# Main routing tree
route:
  # Default grouping
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default-receiver

  # Specialized routing rules
  routes:
    # Critical alerts route
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 0s
      repeat_interval: 15m

    # Security team alerts
    - match:
        team: security
      receiver: security-team
      group_by: ['alertname', 'cluster']
      group_wait: 10s

    # Operations team alerts
    - match:
        team: operations
      receiver: ops-team
      group_by: ['alertname', 'service']
      group_interval: 1m

# Alert correlation rules
inhibit_rules:
  # Suppress related lower severity alerts
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'cluster', 'service']

  # System-wide correlation
  - source_match:
      severity: critical
      type: system
    target_match:
      severity: warning
      type: system
    equal: ['cluster', 'service']

# Notification receivers
receivers:
  # Default notification channel
  - name: default-receiver
    email_configs:
      - to: team@pcs.com
        send_resolved: true
        html: '{{ template "email.tmpl" . }}'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  # PagerDuty for critical alerts
  - name: pagerduty-critical
    pagerduty_configs:
      - service_key: ${PAGERDUTY_KEY}
        send_resolved: true
        severity: '{{ .CommonLabels.severity }}'

  # Security team notifications
  - name: security-team
    email_configs:
      - to: security@pcs.com
        send_resolved: true
        require_tls: true
    slack_configs:
      - channel: '#security-alerts'
        send_resolved: true
        priority: high

  # Operations team notifications
  - name: ops-team
    email_configs:
      - to: ops@pcs.com
        send_resolved: true
    slack_configs:
      - channel: '#ops-alerts'
        send_resolved: true