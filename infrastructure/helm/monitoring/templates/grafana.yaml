# Grafana Helm Template v6.50.0
# Production-grade deployment for Port Community System monitoring

{{/* Generate Grafana deployment */}}
{{- define "grafana.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Values.grafana.namespace | default "monitoring" }}
  labels:
    app: grafana
    release: {{ .Release.Name }}
    component: monitoring
spec:
  replicas: {{ .Values.grafana.replicas | default 2 }}
  selector:
    matchLabels:
      app: grafana
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: grafana
        release: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      serviceAccountName: {{ .Release.Name }}-grafana
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - grafana
              topologyKey: kubernetes.io/hostname
      containers:
      - name: grafana
        image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-grafana
              key: admin-password
        - name: GF_PATHS_DATA
          value: /var/lib/grafana
        - name: GF_PATHS_LOGS
          value: /var/log/grafana
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: storage
          mountPath: /var/lib/grafana
        resources:
          requests:
            cpu: {{ .Values.grafana.resources.requests.cpu | default "200m" }}
            memory: {{ .Values.grafana.resources.requests.memory | default "256Mi" }}
          limits:
            cpu: {{ .Values.grafana.resources.limits.cpu | default "500m" }}
            memory: {{ .Values.grafana.resources.limits.memory | default "512Mi" }}
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          timeoutSeconds: 30
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 30
      volumes:
      - name: config
        configMap:
          name: {{ .Release.Name }}-grafana
      - name: datasources
        configMap:
          name: {{ .Release.Name }}-grafana-datasources
      - name: dashboards
        configMap:
          name: {{ .Release.Name }}-grafana-dashboards
      - name: storage
        {{- if .Values.grafana.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-grafana
        {{- else }}
        emptyDir: {}
        {{- end }}
---
{{/* Generate Grafana service */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Values.grafana.namespace | default "monitoring" }}
  labels:
    app: grafana
    release: {{ .Release.Name }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: grafana
    release: {{ .Release.Name }}
---
{{/* Generate Grafana config */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Values.grafana.namespace | default "monitoring" }}
  labels:
    app: grafana
    release: {{ .Release.Name }}
data:
  grafana.ini: |
    [server]
    root_url = {{ .Values.grafana.server.rootUrl }}
    [auth]
    disable_login_form = false
    [security]
    admin_user = admin
    allow_embedding = true
    [users]
    allow_sign_up = false
    auto_assign_org_role = Viewer
    [auth.basic]
    enabled = true
    [auth.proxy]
    enabled = false
    [smtp]
    enabled = true
    host = {{ .Values.grafana.smtp.host }}
    user = {{ .Values.grafana.smtp.user }}
    password = {{ .Values.grafana.smtp.password }}
    from_address = {{ .Values.grafana.smtp.fromAddress }}
    [metrics]
    enabled = true
    [dashboards]
    versions_to_keep = 20
---
{{/* Generate Grafana persistent volume claim if enabled */}}
{{- if .Values.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Values.grafana.namespace | default "monitoring" }}
  labels:
    app: grafana
    release: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size | default "10Gi" }}
  storageClassName: {{ .Values.grafana.persistence.storageClass | default "standard" }}
{{- end }}
---
{{/* Generate Grafana network policy */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Values.grafana.namespace | default "monitoring" }}
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: loki
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: loki
---
{{/* Generate Grafana pod disruption budget for HA */}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Values.grafana.namespace | default "monitoring" }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: grafana
      release: {{ .Release.Name }}
{{- end }}