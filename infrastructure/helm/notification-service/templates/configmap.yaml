apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}-config
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  # RabbitMQ configuration
  rabbitmq.json: |
    {
      "connection": {
        "host": {{ .Values.rabbitmq.host | quote }},
        "port": {{ .Values.rabbitmq.port }},
        "username": {{ .Values.rabbitmq.username | quote }},
        "vhost": {{ .Values.rabbitmq.vhost | quote }}
      },
      "exchanges": {
        "default": {{ .Values.rabbitmq.exchanges.notifications | quote }},
        "deadLetter": "{{ .Values.rabbitmq.exchanges.notifications }}.dlx"
      },
      "queues": {
        "notifications": {{ .Values.rabbitmq.queues.notifications | quote }},
        "deadLetter": {{ .Values.rabbitmq.queues.deadLetter | quote }}
      },
      "options": {
        "heartbeat": 60,
        "reconnectTimeoutMs": 5000,
        "prefetch": 100,
        "persistent": true
      },
      "patterns": {
        "vessel": "vessel.#",
        "cargo": "cargo.#",
        "berth": "berth.#",
        "document": "document.#"
      }
    }

  # Socket.IO configuration
  socket.json: |
    {
      "server": {
        "port": {{ .Values.service.socketPort }},
        "path": "/socket.io",
        "pingTimeout": {{ .Values.socketio.pingTimeout }},
        "pingInterval": {{ .Values.socketio.pingInterval }},
        "maxHttpBufferSize": {{ .Values.socketio.maxHttpBufferSize }},
        "transports": {{ .Values.socketio.transports | toJson }},
        "maxConnections": 1000
      },
      "cors": {
        "origin": {{ .Values.socketio.cors.origin | quote }},
        "methods": {{ .Values.socketio.cors.methods | toJson }},
        "credentials": true
      },
      "namespaces": {
        "vessel": "/vessel",
        "cargo": "/cargo",
        "berth": "/berth",
        "document": "/document"
      },
      "events": {
        "vessel": {
          "update": "vessel.update",
          "position": "vessel.position",
          "status": "vessel.status"
        },
        "cargo": {
          "status": "cargo.status",
          "location": "cargo.location",
          "customs": "cargo.customs"
        },
        "berth": {
          "allocated": "berth.allocated",
          "released": "berth.released",
          "status": "berth.status"
        },
        "document": {
          "processed": "document.processed",
          "validated": "document.validated",
          "error": "document.error"
        }
      }
    }

  # Application configuration
  app.json: |
    {
      "env": {{ .Values.env.NODE_ENV | quote }},
      "logLevel": {{ .Values.env.LOG_LEVEL | quote }},
      "api": {
        "port": {{ .Values.service.port }},
        "rateLimits": {
          "windowMs": 900000,
          "max": 1000
        },
        "timeout": 5000
      },
      "monitoring": {
        "metrics": {
          "enabled": true,
          "path": "/metrics"
        },
        "health": {
          "enabled": true,
          "path": "/health"
        }
      },
      "performance": {
        "maxConcurrentConnections": 1000,
        "messageRateLimit": 100,
        "messageQueueSize": 1000,
        "workerThreads": 4
      }
    }