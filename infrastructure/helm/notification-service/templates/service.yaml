apiVersion: v1
kind: Service
metadata:
  name: {{ template "notification-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ template "notification-service.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: notification
    app.kubernetes.io/part-of: pcs
spec:
  type: {{ .Values.service.type }}
  ports:
    # HTTP API endpoint
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      
    # WebSocket endpoint for real-time notifications
    - name: websocket
      port: {{ .Values.service.socketPort }}
      targetPort: websocket
      protocol: TCP
      
  # Selector for pod discovery
  selector:
    app.kubernetes.io/name: {{ template "notification-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    
  # Session affinity for WebSocket connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hour timeout