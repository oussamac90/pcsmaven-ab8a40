apiVersion: v2
name: pcs-ingress
description: Enterprise-grade Port Community System ingress controller Helm chart with integrated WAF, TLS management, and high availability features
type: application
version: 1.0.0
appVersion: 1.0.0

# Dependencies required for the ingress controller
dependencies:
  # Production-grade NGINX ingress controller
  - name: ingress-nginx
    version: 4.7.1
    repository: https://kubernetes.github.io/ingress-nginx

  # Automated certificate management
  - name: cert-manager
    version: 1.12.0
    repository: https://charts.jetstack.io
    condition: tls.enabled

# Chart maintainers
maintainers:
  - name: PCS Team
    email: pcs-team@example.com

# Keywords for chart discovery and categorization
keywords:
  - ingress
  - load-balancer
  - tls
  - security
  - waf
  - high-availability
  - port-community-system