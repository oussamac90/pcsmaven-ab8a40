apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    # Ingress controller configuration
    kubernetes.io/ingress.class: nginx
    
    # Security configurations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress-nginx.controller.config.proxy-body-size | quote }}
    nginx.ingress.kubernetes.io/proxy-buffer-size: {{ .Values.ingress-nginx.controller.config.proxy-buffer-size | quote }}
    
    # WAF and OWASP security rules
    nginx.ingress.kubernetes.io/enable-modsecurity: {{ .Values.ingress-nginx.controller.config.enable-modsecurity | quote }}
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: {{ .Values.ingress-nginx.controller.config.enable-owasp-core-rules | quote }}
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecAuditEngine RelevantOnly
      SecAuditLogParts ABIJDEFHZ
    
    # Rate limiting and DDoS protection
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress-nginx.controller.config.limit-rps | quote }}
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/limit-rpm: "100"
    
    # Timeouts and connection settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'";
    
    # Load balancing configuration
    nginx.ingress.kubernetes.io/load-balance: "{{ .Values.ingress-nginx.service.annotations.loadBalancer.algorithm | default "round_robin" }}"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    
    # Monitoring
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"

spec:
  ingressClassName: nginx
  {{- if .Values.tls.enabled }}
  tls:
  - hosts:
    {{- range .Values.tls.hosts }}
    - {{ . | quote }}
    {{- end }}
    secretName: {{ .Values.tls.secretName }}
  {{- end }}
  rules:
  {{- range .Values.rules }}
  - host: {{ .host }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ .service.name }}
            port:
              number: {{ .service.port }}
      {{- end }}
  {{- end }}
  {{- if .Values.defaultBackend }}
  defaultBackend:
    service:
      name: {{ .Values.defaultBackend.service.name }}
      port:
        number: {{ .Values.defaultBackend.service.port }}
  {{- end }}