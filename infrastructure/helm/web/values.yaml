# Default values for Port Community System web application
# This is a YAML-formatted file.

# Helm chart version: v3

# Override name of the chart
nameOverride: ""
# Override the full name of resources
fullnameOverride: ""

# Container image configuration
image:
  # Docker image repository
  repository: pcs/web
  # Image tag
  tag: 1.0.0
  # Image pull policy
  pullPolicy: IfNotPresent
  # Image pull secrets for private registry
  pullSecrets:
    - pcs-registry

# Deployment configuration
deployment:
  # Number of replicas for high availability
  replicaCount: 2
  
  # Update strategy for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  # Resource allocation based on container strategy
  resources:
    limits:
      cpu: "0.5"
      memory: "1Gi"
    requests:
      cpu: "0.2"
      memory: "512Mi"
  
  # Pod annotations for Prometheus metrics
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
  
  # Pod anti-affinity for high availability
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
  
  # Horizontal Pod Autoscaling configuration
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300

# Service configuration
service:
  # Service type
  type: ClusterIP
  # Service port
  port: 80
  # Container port
  targetPort: 80
  # Session affinity for consistent routing
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

# Environment variables
env:
  NODE_ENV: production
  API_URL: http://api-gateway
  SOCKET_URL: ws://notification-service
  MAX_CONCURRENT_USERS: "1000"
  RESPONSE_TIMEOUT: "2000"

# Health check probes
livenessProbe:
  httpGet:
    path: /health
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health
    port: 80
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# Ingress configuration
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: pcs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pcs-web-tls
      hosts:
        - pcs.example.com

# Monitoring configuration
monitoring:
  # Prometheus metrics configuration
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: "15s"
  # Logging configuration
  logging:
    enabled: true
    format: json