apiVersion: v2
name: api-gateway
description: API Gateway service for Port Community System
type: application
version: 1.0.0
appVersion: 1.0.0

keywords:
  - api-gateway
  - port-community-system
  - nodejs
  - security
  - monitoring
  - authentication

maintainers:
  - name: PCS Team
    email: team@pcs.com

dependencies:
  - name: nginx-ingress
    version: 4.7.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress.enabled
    tags:
      - routing
      - load-balancing

  - name: prometheus
    version: 19.7.2
    repository: https://prometheus-community.github.io/helm-charts
    condition: serviceMonitor.enabled
    tags:
      - monitoring
      - metrics
      - security

  - name: cert-manager
    version: 1.11.1
    repository: https://charts.jetstack.io
    condition: ingress.tls.enabled
    tags:
      - security
      - certificates
      - tls

annotations:
  artifacthub.io/changes: Initial release of API Gateway Helm chart with enhanced security monitoring
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/recommendations: Use with recommended security settings enabled
  artifacthub.io/securityUpdates: Includes latest security patches and monitoring capabilities