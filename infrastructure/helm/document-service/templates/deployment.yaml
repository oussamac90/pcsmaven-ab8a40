apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "document-service.fullname" . }}
  labels:
    {{- include "document-service.labels" . | nindent 4 }}
  annotations:
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "document-service.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "document-service.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "document-service.serviceAccountName" . }}
      initContainers:
        - name: init-edifact
          image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
          imagePullPolicy: {{ .Values.initImage.pullPolicy }}
          command:
            - sh
            - -c
            - initialize-edifact-schemas.sh
          volumeMounts:
            - name: edifact-schemas
              mountPath: /etc/edifact/schemas
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: EDIFACT_CONFIG_PATH
              value: /etc/edifact/config/edifact.yaml
            - name: MESSAGE_STORE_PATH
              value: /var/lib/edifact/messages
            - name: MAX_MESSAGE_SIZE
              value: {{ .Values.edifact.maxMessageSize | quote }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "document-service.fullname" . }}-mongodb
                  key: uri
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "document-service.fullname" . }}-redis
                  key: uri
          volumeMounts:
            - name: edifact-config
              mountPath: /etc/edifact/config
              readOnly: true
            - name: edifact-schemas
              mountPath: /etc/edifact/schemas
              readOnly: true
            - name: message-store
              mountPath: /var/lib/edifact/messages
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /startup
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: edifact-config
          configMap:
            name: {{ include "document-service.fullname" . }}-config
        - name: edifact-schemas
          emptyDir: {}
        - name: message-store
          persistentVolumeClaim:
            claimName: {{ include "document-service.fullname" . }}-messages
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}