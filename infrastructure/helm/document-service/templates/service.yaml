apiVersion: v1
kind: Service
metadata:
  name: {{ include "document-service.fullname" . }}
  labels:
    {{- include "document-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: document-processing
  annotations:
    # Service monitoring annotations
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.service.port }}"
    # Security annotations
    security.cloud.google.com/use-ip-aliases: "true"
    # Documentation annotations
    service.kubernetes.io/description: "Document Service for EDIFACT processing"
    service.kubernetes.io/protocol: "HTTP"

spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "document-service.selectorLabels" . | nindent 4 }}
  # Enhanced security settings
  sessionAffinity: None
  # Internal traffic policy for improved security
  internalTrafficPolicy: Cluster
  # IPv4/IPv6 configuration
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  # Publishing not ready addresses configuration
  publishNotReadyAddresses: false
  # Ensure proper load balancing
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800