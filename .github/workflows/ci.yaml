name: Continuous Integration

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/backend/**'
      - 'src/web/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/backend/**'
      - 'src/web/**'
      - '.github/workflows/**'

env:
  NODE_VERSION: '18.x'
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.9'
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, core-service, document-service, web]
      fail-fast: true
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Snyk
        uses: snyk/actions/setup@v1
        with:
          snyk-version: latest

      # API Gateway Build Steps
      - name: Setup Node.js for API Gateway
        if: matrix.service == 'api-gateway'
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/backend/api-gateway/package-lock.json

      - name: Build API Gateway
        if: matrix.service == 'api-gateway'
        working-directory: src/backend/api-gateway
        run: |
          npm ci --audit
          npm run lint
          npm run test:coverage
          npm run build
          snyk test --severity-threshold=high
          snyk code test --severity-threshold=high

      # Core Service Build Steps
      - name: Setup Java for Core Service
        if: matrix.service == 'core-service'
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Maven Wrapper
        if: matrix.service == 'core-service'
        working-directory: src/backend/core-service
        run: |
          echo "Verifying Maven wrapper..."
          mvn --version
          
      - name: Build Core Service
        if: matrix.service == 'core-service'
        working-directory: src/backend/core-service
        run: |
          mvn verify -B -P security-scan
          mvn package -DskipTests
          snyk test --severity-threshold=high
          snyk code test --severity-threshold=high

      # Document Service Build Steps
      - name: Setup Python for Document Service
        if: matrix.service == 'document-service'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        if: matrix.service == 'document-service'
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry config virtualenvs.create false

      - name: Build Document Service
        if: matrix.service == 'document-service'
        working-directory: src/backend/document-service
        run: |
          poetry install
          poetry run safety check
          poetry run mypy src/
          poetry run pytest
          poetry run bandit -r src/
          snyk test --severity-threshold=high
          snyk code test --severity-threshold=high

      # Upload Artifacts and Reports
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.service }}-artifacts
          path: |
            src/backend/${{ matrix.service }}/dist
            src/backend/${{ matrix.service }}/target
            src/backend/${{ matrix.service }}/__pycache__
          retention-days: 7

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            src/backend/${{ matrix.service }}/coverage
            src/backend/${{ matrix.service }}/target/site/jacoco
            src/backend/${{ matrix.service }}/htmlcov
          retention-days: 7

      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.service }}-security-reports
          path: |
            src/backend/${{ matrix.service }}/.snyk
            src/backend/${{ matrix.service }}/target/dependency-check-report.html
            src/backend/${{ matrix.service }}/bandit-report.html
          retention-days: 7

      # Notify on Failure
      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Build failed for ${{ matrix.service }}"