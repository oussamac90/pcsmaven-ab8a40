# Kubernetes Secrets configuration for Port Community System (PCS)
# Version: 1.0
# Security: Critical - Contains sensitive configuration data
# Encryption: Values must be base64 encoded before applying

apiVersion: v1
kind: Secret
metadata:
  name: core-service-secrets
  namespace: pcs
  labels:
    app: pcs
    component: core-service
  annotations:
    encryption.kubernetes.io/kms-key: "arn:aws:kms:region:account:key/core-service-key"
    secret.kubernetes.io/rotation-period: "90d"
    secret.kubernetes.io/audit-enabled: "true"
type: Opaque
data:
  # Database Configuration
  DB_USERNAME: cGNzX2RiX3VzZXI= # pcs_db_user
  DB_PASSWORD: UGFzc3dvcmQxMjMh # Password123!
  DB_CONNECTION_POOL_SIZE: MTAw # 100
  
  # JWT Configuration
  JWT_SECRET: YTIzYmM0NWQ2ZTdmOGc5aA== # a23bc45d6e7f8g9h
  JWT_ISSUER_URI: aHR0cHM6Ly9wY3MuZXhhbXBsZS5jb20= # https://pcs.example.com
  JWT_JWK_SET_URI: aHR0cHM6Ly9wY3MuZXhhbXBsZS5jb20vLndlbGwta25vd24vandrcw== # https://pcs.example.com/.well-known/jwks
  JWT_TOKEN_EXPIRY: ODY0MDA= # 86400 (24 hours)
  
  # Redis Configuration
  REDIS_PASSWORD: UmVkaXNQYXNzMTIzIQ== # RedisPass123!
  REDIS_CLUSTER_ENABLED: dHJ1ZQ== # true

---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: pcs
  labels:
    app: pcs
    component: api-gateway
  annotations:
    encryption.kubernetes.io/kms-key: "arn:aws:kms:region:account:key/api-gateway-key"
    secret.kubernetes.io/rotation-period: "90d"
    secret.kubernetes.io/audit-enabled: "true"
type: Opaque
data:
  # JWT Configuration
  JWT_SECRET: YTIzYmM0NWQ2ZTdmOGc5aA== # a23bc45d6e7f8g9h
  
  # Auth0 Configuration
  AUTH0_CLIENT_SECRET: YXV0aDBjbGllbnRzZWNyZXQ= # auth0clientsecret
  AUTH0_CLIENT_ID: YXV0aDBjbGllbnRpZA== # auth0clientid
  AUTH0_DOMAIN: cGNzLmF1dGgwLmNvbQ== # pcs.auth0.com
  AUTH0_AUDIENCE: aHR0cHM6Ly9hcGkucGNzLmV4YW1wbGUuY29t # https://api.pcs.example.com
  
  # API Security
  API_KEY_SALT: YXBpa2V5c2FsdDEyMw== # apikeysalt123
  API_KEY_EXPIRY: OTA= # 90
  RATE_LIMIT_SECRET: cmF0ZWxpbWl0c2VjcmV0MTIz # ratelimitsecret123

---
apiVersion: v1
kind: Secret
metadata:
  name: document-service-secrets
  namespace: pcs
  labels:
    app: pcs
    component: document-service
  annotations:
    encryption.kubernetes.io/kms-key: "arn:aws:kms:region:account:key/document-service-key"
    secret.kubernetes.io/rotation-period: "90d"
    secret.kubernetes.io/audit-enabled: "true"
type: Opaque
data:
  # MongoDB Configuration
  MONGODB_URI: bW9uZ29kYitzcnY6Ly91c2VyOnBhc3NAY2x1c3Rlci5tb25nby5uZXQvcGNz # mongodb+srv://user:pass@cluster.mongo.net/pcs
  
  # RabbitMQ Configuration
  RABBITMQ_URI: YW1xcDovL3VzZXI6cGFzc0ByYWJiaXRtcS5wY3M= # amqp://user:pass@rabbitmq.pcs
  RABBITMQ_VHOST: cGNz # pcs
  
  # Redis Configuration
  REDIS_URI: cmVkaXM6Ly91c2VyOnBhc3NAcmVkaXMucGNz # redis://user:pass@redis.pcs
  
  # Storage Configuration
  STORAGE_ACCESS_KEY: YWNjZXNza2V5MTIz # accesskey123
  STORAGE_SECRET_KEY: c2VjcmV0a2V5MTIz # secretkey123
  STORAGE_REGION: dXMtZWFzdC0x # us-east-1
  STORAGE_BUCKET: cGNzLWRvY3VtZW50cw== # pcs-documents