apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pcs-services-monitor
  namespace: monitoring
  labels:
    app: pcs
    release: prometheus
    monitoring: enabled
spec:
  selector:
    matchLabels:
      app: pcs
      monitoring: enabled
    matchExpressions:
      - key: environment
        operator: In
        values:
          - production
          - staging
  namespaceSelector:
    matchNames:
      - pcs
  endpoints:
    # API Gateway Metrics
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      honorTimestamps: true
      enableHttp2: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          regex: api-gateway
          action: keep
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'http_request_duration_seconds|http_requests_total|authentication_failures_total|waf_blocked_requests_total'
          action: keep

    # Core Service Metrics
    - port: metrics
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      honorTimestamps: true
      enableHttp2: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          regex: core-service
          action: keep
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'jvm_memory_used_bytes|process_cpu_usage|hikaricp_connections_active|http_server_requests_seconds'
          action: keep

    # Document Service Metrics
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      honorTimestamps: true
      enableHttp2: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          regex: document-service
          action: keep
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'document_processing_duration_seconds|document_validation_errors_total|edifact_messages_processed_total|storage_operations_total'
          action: keep

    # Notification Service Metrics
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      honorTimestamps: true
      enableHttp2: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          regex: notification-service
          action: keep
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'notification_delivery_duration_seconds|notification_failures_total|websocket_connections_active|message_queue_size'
          action: keep

  # Common endpoint configurations
  targetLabels:
    - app
    - component
    - environment
  
  # Additional configurations for robust monitoring
  sampleLimit: 10000
  attachMetadata:
    node: true
  
  # TLS configuration for secure metrics collection
  tlsConfig:
    insecureSkipVerify: false
    serverName: "*.pcs.svc.cluster.local"

---
# Prometheus Rules for Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pcs-alert-rules
  namespace: monitoring
  labels:
    app: pcs
    release: prometheus
spec:
  groups:
    - name: pcs.rules
      rules:
        # Performance Alerts
        - alert: HighLatency
          expr: http_request_duration_seconds > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency detected"
            description: "Request latency is above 2 seconds for 5 minutes"

        - alert: HighErrorRate
          expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected"
            description: "Error rate is above 5% for 5 minutes"

        # Resource Usage Alerts
        - alert: HighCPUUsage
          expr: process_cpu_usage > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage detected"
            description: "CPU usage is above 80% for 10 minutes"

        - alert: HighMemoryUsage
          expr: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage detected"
            description: "Memory usage is above 85% for 10 minutes"

        # Security Alerts
        - alert: SecurityAlert
          expr: rate(waf_blocked_requests_total[5m]) > 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Security threat detected"
            description: "WAF blocked requests rate is above threshold"

        # Database Alerts
        - alert: DatabaseConnectionsSaturated
          expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Database connections near capacity"
            description: "Database connection pool is above 90% capacity"